# ---------------------------------------------------------------------------
# Data Entry Management Platform - application configuration
# Implements the configuration from specification 06, section 2.
#
# Every value that differs between a laptop, a Docker container and a
# production VM is written as ${ENV_VAR:default}. That single pattern lets the
# same jar run in all three places without an extra profile file.
# ---------------------------------------------------------------------------

spring.application.name=data-entry-platform

# --- Database -------------------------------------------------------------
# DB_HOST defaults to localhost, which is correct when the app runs on the
# host. Inside Docker Compose the override sets DB_HOST=mysql, because a
# container cannot reach the database through "localhost" - that resolves to
# the container itself.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:data_entry_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:datauser}
spring.datasource.password=${DB_PASSWORD:datapassword}

# HikariCP connection pool. MySQL closes idle connections after 8 hours by
# default (wait_timeout), which is shorter than a container that stays up over
# a weekend, so a validation query runs before a connection is handed out.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# --- JPA / Hibernate ------------------------------------------------------
# "update" creates the data_entries table on first start, matching the schema
# in specification 05. Production should use Flyway instead of this setting.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ------------------------------------------------------------
# Caching is off by default so template edits appear on refresh. Compose sets
# THYMELEAF_CACHE=true for the packaged container, where templates are baked in.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Actuator (specification 06, section 4) -------------------------------
# Expose only what is needed: health backs the Docker health check, info adds
# the application name. Details stay hidden unless authorised.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- Server ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# Allow the reason phrase to be shown on the custom error page, which is how
# the GlobalExceptionHandler surfaces its friendly message.
server.error.include-message=always

# --- Logging --------------------------------------------------------------
logging.level.com.example.dataentry=${LOG_LEVEL:INFO}
