<!--
  Notification area (spec 02 section 5: notifications fade in, stay visible
  briefly, then fade out).

  Two ways this fragment is used:
    1. Included in a page:  <div th:replace="~{fragments/alerts :: alerts}"></div>
       where the model carries successMessage and/or errorMessage.
    2. Returned directly by GlobalExceptionHandler as the view
       "fragments/alerts" for failed HTMX requests, with only errorMessage set.

  Both cases render the same markup, which is why the root element is the
  fragment itself. data-auto-dismiss lets app.js fade the message out on a timer.
-->
<div th:fragment="alerts" id="alert-area" class="app-alerts">
    <!-- Server-side failure: a business rule was rejected or a record was missing. -->
    <div th:if="${errorMessage}" class="alert alert-danger app-alert" role="alert"
         data-auto-dismiss="6000">
        <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
        <span th:text="${errorMessage}">Something went wrong.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Confirmed save. -->
    <div th:if="${successMessage}" class="alert alert-success app-alert" role="status"
         data-auto-dismiss="4000">
        <i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i>
        <span th:text="${successMessage}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
